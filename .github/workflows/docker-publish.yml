name: Build & Push Docker images

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag_1:
        description: "Tag untuk image #1 (ex: v2.0.1)"
        required: true
        default: "v2.0.1"
      api_url_1:
        description: "API base URL image #1 (full URL)"
        required: true
        default: "http://192.168.245.156:3210/api"
      socket_url_1:
        description: "Socket base URL image #1 (full URL, ws://...)"
        required: true
        default: "ws://192.168.245.156:3001"

      image_tag_2:
        description: "Tag untuk image #2 (ex: v2.0.1-2)"
        required: true
        default: "v2.0.1-2"
      api_url_2:
        description: "API base URL image #2 (full URL)"
        required: true
        default: "http://192.168.205.170:3210/api"
      socket_url_2:
        description: "Socket base URL image #2 (full URL, ws://...)"
        required: true
        default: "ws://192.168.205.170:3001"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (multi-platform builder)
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image 1
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: agungkusaeri/stock-control:${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref != '' && github.ref != null && startsWith(github.ref, 'refs/tags/') ? github.ref_name : inputs.image_tag_1 }},agungkusaeri/stock-control:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.api_url_1 }}
            NEXT_PUBLIC_SOCKET_BASE_URL=${{ inputs.socket_url_1 }}

      - name: Build & push image 2
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: agungkusaeri/stock-control:${{ inputs.image_tag_2 }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.api_url_2 }}
            NEXT_PUBLIC_SOCKET_BASE_URL=${{ inputs.socket_url_2 }}
