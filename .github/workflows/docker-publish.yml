name: Build & Push Docker images

on:
  push:
    branches:
      - main   # jalan setiap ada push ke main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =============================
      # IMAGE 1
      # =============================
      - name: Build & Push Image 1 (v2.0.1)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: agungkusaeri/stock-control:v2.0.1
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://192.168.245.156:3210/api
            NEXT_PUBLIC_SOCKET_BASE_URL=ws://192.168.245.156:3001

      # =============================
      # IMAGE 2
      # =============================
      - name: Build & Push Image 2 (v2.0.1-2)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: agungkusaeri/stock-control:v2.0.1-2
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://192.168.205.170:3210/api
            NEXT_PUBLIC_SOCKET_BASE_URL=ws://192.168.205.170:3001
